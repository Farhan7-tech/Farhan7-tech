<style><![CDATA[
@font-face{font-family:'GeistMono';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'GeistMono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
text{text-rendering:geometricPrecision}
.r{animation:rise 1.15s cubic-bezier(0.32,0.72,0,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(10px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(0.32,0.72,0,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
.nudge{animation:nudge 3.6s cubic-bezier(0.32,0.72,0,1) infinite}
@keyframes nudge{0%,62%,100%{transform:translate(0,0)}74%{transform:translate(3px,-3px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(0.32,0.72,0,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.orb1z{animation:orb1zk 10s cubic-bezier(0.37,0,0.63,1) infinite alternate}@keyframes orb1zk{from{transform:translate(0,0)}to{transform:translate(0px,0px)}}
.flick{animation:flick 5s steps(1) infinite}@keyframes flick{0%,100%{opacity:1}92%{opacity:.93}93%{opacity:1}96%{opacity:.96}}
.sweep{animation:sweep 6s cubic-bezier(0.45,0,0.55,1) infinite}@keyframes sweep{from{transform:translateY(-120px)}to{transform:translateY(538px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>
