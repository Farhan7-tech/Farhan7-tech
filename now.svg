<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
<defs><linearGradient id="pcore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C0C0F"/><stop offset="1" stop-color="#060607"/></linearGradient>
<linearGradient id="phl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".22" stop-color="#fff" stop-opacity=".045"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
