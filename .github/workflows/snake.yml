name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#D85A30&color_dots=#F4EEE2,#F0C4AE,#E8A27F,#D85A30,#8A3A1E
            dist/snake-dark.svg?palette=github-dark&color_snake=#F4EEE2&color_dots=#1A1512,#4A2416,#8A3A1E,#B8441F,#D85A30

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
