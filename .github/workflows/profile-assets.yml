name: Profile assets

# Rebuilds the live images on the profile README and publishes them to the `output` branch:
#   now.svg                  latest public work (design/build.js --now)
#   3d-dark.svg / 3d-light.svg   3D contribution graph
#   snake.svg / snake-dark.svg   contribution snake
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - design/**
      - .github/workflows/profile-assets.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Now card
        working-directory: design
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          node build.js --now ../dist

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - run: |
          cp profile-3d-contrib/profile-night-green.svg dist/3d-dark.svg
          cp profile-3d-contrib/profile-green-animate.svg dist/3d-light.svg

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#a7f3d0,#34d399,#059669,#065f46
            dist/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#15171c,#064e3b,#047857,#10b981,#6ee7b7

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
